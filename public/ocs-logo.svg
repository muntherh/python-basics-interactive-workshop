<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1b6e3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d3d1f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e63946;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a4161a;stop-opacity:1" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5"/>
    </filter>
  </defs>
  
  <!-- Outer green circle -->
  <circle cx="220" cy="210" r="160" fill="none" stroke="url(#greenGradient)" stroke-width="54" filter="url(#softGlow)"/>
  
  <!-- Inner red accent curve -->
  <path d="M 280 100 Q 310 170 280 260 Q 240 300 200 330" fill="none" stroke="url(#redGradient)" stroke-width="52" stroke-linecap="round" filter="url(#softGlow)"/>
  
  <!-- Pixel squares (top-left of circle) -->
  <g fill="#1b6e3a" opacity="0.8">
    <rect x="100" y="60" width="20" height="20"/>
    <rect x="130" y="75" width="20" height="20"/>
    <rect x="150" y="95" width="18" height="18"/>
    <rect x="115" y="105" width="16" height="16"/>
    <rect x="85" y="90" width="18" height="18"/>
  </g>
  
  <!-- Castle/Monument inside circle -->
  <g fill="#8B7355" opacity="0.75">
    <!-- Main tower -->
    <rect x="190" y="160" width="32" height="110"/>
    <!-- Tower top (pyramid roof) -->
    <polygon points="190,160 206,140 222,160"/>
    <!-- Main castle body -->
    <rect x="160" y="200" width="120" height="70"/>
    <!-- Right tower -->
    <rect x="240" y="175" width="30" height="95"/>
    <!-- Right tower roof -->
    <polygon points="240,175 255,155 270,175"/>
    <!-- Left tower -->
    <rect x="155" y="180" width="28" height="90"/>
    <!-- Left tower roof -->
    <polygon points="155,180 169,160 183,180"/>
    <!-- Crenellations on main wall -->
    <rect x="165" y="198" width="12" height="8"/>
    <rect x="190" y="198" width="12" height="8"/>
    <rect x="215" y="198" width="12" height="8"/>
    <rect x="240" y="198" width="12" height="8"/>
  </g>
  
  <!-- Flag on main tower -->
  <g>
    <rect x="210" y="155" width="40" height="28" fill="#e63946"/>
    <polygon points="210,155 210,183 185,169" fill="#a4161a"/>
  </g>
  
  <!-- OCS Text -->
  <text x="480" y="280" font-family="Arial, sans-serif" font-size="200" font-weight="bold" fill="#1b6e3a" filter="url(#softGlow)" letter-spacing="-8">
    OCS
  </text>
  
  <!-- Organization name (Arabic) -->
  <text x="550" y="380" font-family="Arial, sans-serif" font-size="48" fill="#6d7e97" filter="url(#softGlow)" text-anchor="middle">
    جمعية عمّان للحوسبية
  </text>
  
  <!-- Organization name (English) -->
  <text x="550" y="435" font-family="Arial, sans-serif" font-size="38" fill="#4a5568" letter-spacing="2" filter="url(#softGlow)" text-anchor="middle">
    OMAN COMPUTING SOCIETY
  </text>
  
  <!-- Subtitle -->
  <text x="550" y="480" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#e63946" letter-spacing="8" filter="url(#softGlow)" text-anchor="middle">
    OCS
  </text>
</svg>